[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifrs16-lbo-engine"
version = "1.0.0"
description = "IFRS-16 covenant benchmarking with analytic screening and full simulation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aniket Bhardwaj", email = "bhardwaj.aniket2002@gmail.com" }]
dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "scipy>=1.7.0",
  "matplotlib>=3.4.0",
  "seaborn>=0.11.0",
  "scikit-learn>=1.0.0",
  "numpy-financial>=1.0.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=6.0.0", "pytest-cov>=4.0.0", "ruff>=0.6.0", "jupyter>=1.0.0"]

[project.scripts]
ifrs16-case-study = "analysis.scripts.case_study_accor:run_accor_case_study"
ifrs16-benchmark = "analysis.run_benchmark:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["analysis*", "lbo*"]

[tool.ruff]
line-length = 100
target-version = "py310"

exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "streamlit_app.py"
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F401", "F403", "F841"]
